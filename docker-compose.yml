
version: '3.8'

services:
  db:
    image: postgres:14
    container_name: tenant_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:postgres}
      POSTGRES_USER: ${POSTGRES_USER:user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:password}
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: demo_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL_BASE: ${SPRING_DATASOURCE_URL_BASE:jdbc:postgresql://db:5432/}
      POSTGRES_USER: ${POSTGRES_USER:user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:password}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
